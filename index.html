<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="style.css" />
    <title>TECHSTORE</title>
  </head>
  <body>
    <header class="header">
      <div class="logo">
        <img width="350px" src="/images/TechStore.png" alt="TechStore" />
      </div>
      <nav>
        <ul>
          <li><a href="#">მთავარი</a></li>
          <li><a href="#">ჩვენ შესახებ</a></li>
          <li><a href="#">სერვისები</a></li>
          <li><a href="#">კონტაქტი</a></li>
        </ul>
      </nav>
      <div class="search-div">
        <input class="search" type="search" placeholder="search..." />
        <input class="search-btn" type="button" value="🔍" />
      </div>

      <button class="button">
        <svg
          viewBox="0 0 16 16"
          class="bi bi-cart-check"
          height="90px"
          width="90px"
          xmlns="http://www.w3.org/2000/svg"
          fill="#fff"
        >
          <path
            d="M11.354 6.354a.5.5 0 0 0-.708-.708L8 8.293 6.854 7.146a.5.5 0 1 0-.708.708l1.5 1.5a.5.5 0 0 0 .708 0l3-3z"
          ></path>
          <path
            d="M.5 1a.5.5 0 0 0 0 1h1.11l.401 1.607 1.498 7.985A.5.5 0 0 0 4 12h1a2 2 0 1 0 0 4 2 2 0 0 0 0-4h7a2 2 0 1 0 0 4 2 2 0 0 0 0-4h1a.5.5 0 0 0 .491-.408l1.5-8A.5.5 0 0 0 14.5 3H2.89l-.405-1.621A.5.5 0 0 0 2 1H.5zm3.915 10L3.102 4h10.796l-1.313 7h-8.17zM6 14a1 1 0 1 1-2 0 1 1 0 0 1 2 0zm7 0a1 1 0 1 1-2 0 1 1 0 0 1 2 0z"
          ></path>
        </svg>
        <p class="text">Buy Now</p>
      </button>
    </header>
    <main>
      <div class="advertisement">
        <img src="/images/geotech.jpg" alt="ad banner" />
      </div>
    </main>
  </body>
</html>
